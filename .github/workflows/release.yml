name: Release

# Publishes @bambiste/countries to public npm when a version tag (v*) is pushed:
#   npm version patch && git push --follow-tags   (or push a v* tag manually)
# Requires an NPM_TOKEN secret with publish rights to the @bambiste org.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          scope: '@bambiste'

      - name: Install
        run: npm ci

      # prepublishOnly runs the tsc build. --provenance is skipped (repo may be
      # private); publishConfig sets access: public.
      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
